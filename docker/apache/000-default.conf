<VirtualHost *:80>
    DocumentRoot /var/www/html/public
#Safe guard dont apply
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>
</VirtualHost>